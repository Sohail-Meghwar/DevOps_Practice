services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  spring-app:
    build: .
    container_name: employee-crud-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
name: Java CI

on:
  push:
    branches:
      - default

  pull_request:
    branches:
      - default

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean package
